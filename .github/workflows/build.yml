name: build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: 'Neo4j Cypher-DSL'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: 'Set up JDK'
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: zulu
          java-version: 26

      - name: 'Enable Sonar for local PRs not from Dependabot'
        if:  ${{ github.event.sender.login != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: echo "USE_SONAR=sonar" >> $GITHUB_ENV
      - name: 'Disable Sonar for foreign PRs or from Dependabot'
        if:  ${{ github.event.sender.login == 'dependabot[bot]' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        run: echo "USE_SONAR=-sonar" >> $GITHUB_ENV

      - name: 'Cache SonarCloud packages'
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: 'Cache Maven packages'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}-${{ github.sha }}

      - name: 'Run Maven build'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw --no-transfer-progress install -DSCHEMA_NAMES_TEST_ALL_VERSIONS=false -P$USE_SONAR
          -pl !org.neo4j:neo4j-cypher-dsl-examples-core
          -pl !org.neo4j:neo4j-cypher-dsl-examples-parser
          -pl !org.neo4j:neo4j-cypher-dsl-examples-ogm-quarkus
          -pl !org.neo4j:neo4j-cypher-dsl-examples-sdn6

  test_native:
    name: 'Verify compilation on GraalVM native'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 'Set up JDK'
        uses: graalvm/setup-graalvm@6f3fa030c4b8f77c1f554a860f593a654538fa38 # v1.5.6
        with:
          distribution: 'graalvm-community'
          java-version: 25
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Checkout'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: 'Cache Maven packages'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}-${{ github.sha }}

      - name: 'Run Maven build'
        run: >
          ./mvnw --no-transfer-progress clean verify -Djqassistant.skip=true
          -DenableNativeTests -pl org.neo4j:neo4j-cypher-dsl-native-tests

  build_examples:
    name: Verify examples with ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '17', '21', '25', '26' ]
    needs: build
    steps:
      - name: 'Checkout'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: 'Cache Maven packages'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}-${{ github.sha }}

      - name: 'Set up JDK'
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}

      - name: 'Run Maven build'
        run: >
          ./mvnw --no-transfer-progress clean verify -Djqassistant.skip=true
          -pl org.neo4j:neo4j-cypher-dsl-examples
          -pl org.neo4j:neo4j-cypher-dsl-examples-core
          -pl org.neo4j:neo4j-cypher-dsl-examples-parser
          -pl org.neo4j:neo4j-cypher-dsl-examples-ogm-quarkus
          -pl org.neo4j:neo4j-cypher-dsl-examples-sdn6
